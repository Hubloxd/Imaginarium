components:
  schemas:
    ChangePasswordRequest:
      type: object
      description: Serializer do zmiany hasła
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    PatchedChangePasswordRequest:
      type: object
      description: Serializer do zmiany hasła
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
    PatchedUserUpdateRequest:
      type: object
      description: Serializer do aktualizacji danych użytkownika
      properties:
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        avatar:
          type: string
          format: binary
          nullable: true
          description: Zdjęcie profilowe użytkownika
        bio:
          type: string
          title: Biografia
          description: Krótki opis użytkownika
          maxLength: 500
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      description: Serializer do wyświetlania danych użytkownika
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          description: Adres email użytkownika (wymagany)
          maxLength: 254
        username:
          type: string
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        avatar:
          type: string
          format: uri
          nullable: true
          description: Zdjęcie profilowe użytkownika
        bio:
          type: string
          title: Biografia
          description: Krótki opis użytkownika
          maxLength: 500
        is_email_verified:
          type: boolean
          readOnly: true
          title: Email zweryfikowany
          description: Czy adres email został zweryfikowany
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Data utworzenia
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Data aktualizacji
      required:
      - email
      - username
    UserRegistration:
      type: object
      description: Serializer do rejestracji nowych użytkowników
      properties:
        email:
          type: string
          format: email
          description: Adres email użytkownika (wymagany)
          maxLength: 254
        username:
          type: string
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
      required:
      - email
      - username
    UserRegistrationRequest:
      type: object
      description: Serializer do rejestracji nowych użytkowników
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Adres email użytkownika (wymagany)
          maxLength: 254
        username:
          type: string
          minLength: 1
          title: Nazwa użytkownika
          description: Wymagana. 150 lub mniej znaków. Jedynie litery, cyfry i @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
      required:
      - email
      - password
      - username
    UserUpdate:
      type: object
      description: Serializer do aktualizacji danych użytkownika
      properties:
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        avatar:
          type: string
          format: uri
          nullable: true
          description: Zdjęcie profilowe użytkownika
        bio:
          type: string
          title: Biografia
          description: Krótki opis użytkownika
          maxLength: 500
    UserUpdateRequest:
      type: object
      description: Serializer do aktualizacji danych użytkownika
      properties:
        first_name:
          type: string
          title: Imię
          maxLength: 150
        last_name:
          type: string
          title: Nazwisko
          maxLength: 150
        avatar:
          type: string
          format: binary
          nullable: true
          description: Zdjęcie profilowe użytkownika
        bio:
          type: string
          title: Biografia
          description: Krótki opis użytkownika
          maxLength: 500
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:4444
  description: Development server
tags:
- name: accounts
  description: Zarządzanie kontami użytkowników
- name: albums
  description: Zarządzanie albumami
- name: media
  description: Zarządzanie mediami (zdjęcia i filmy)
- name: groups
  description: Zarządzanie grupami
- name: shares
  description: Udostępnianie treści
