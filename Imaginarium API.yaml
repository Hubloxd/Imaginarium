openapi: 3.0.3
info:
  title: Imaginarium API
  version: 1.0.0
  description: API dla aplikacji Imaginarium - galeria zdjęć i filmów
paths:
  /api/accounts/change-password:
    put:
      operationId: accounts_change_password_update
      description: |-
        Endpoint do zmiany hasła użytkownika.
        PUT /api/accounts/change-password/
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_change_password_partial_update
      description: |-
        Endpoint do zmiany hasła użytkownika.
        PUT /api/accounts/change-password/
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/login:
    post:
      operationId: accounts_login_create
      description: |-
        Endpoint do logowania użytkowników.
        POST /api/accounts/login/
        CSRF jest wyłączony przez middleware dla wszystkich /api/ endpointów.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/logout:
    post:
      operationId: accounts_logout_create
      description: |-
        Endpoint do wylogowania użytkownika.
        POST /api/accounts/logout/
        Opcjonalnie można przesłać refresh token w body: {"refresh": "..."}
        Uwaga: Bez blacklist tokeny pozostaną ważne do wygaśnięcia.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/profile:
    get:
      operationId: accounts_profile_retrieve
      description: |-
        Endpoint do pobierania i aktualizacji profilu użytkownika.
        GET /api/accounts/profile/ - pobierz profil
        PUT /api/accounts/profile/ - zaktualizuj profil
        PATCH /api/accounts/profile/ - częściowa aktualizacja profilu
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: accounts_profile_update
      description: |-
        Endpoint do pobierania i aktualizacji profilu użytkownika.
        GET /api/accounts/profile/ - pobierz profil
        PUT /api/accounts/profile/ - zaktualizuj profil
        PATCH /api/accounts/profile/ - częściowa aktualizacja profilu
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    patch:
      operationId: accounts_profile_partial_update
      description: |-
        Endpoint do pobierania i aktualizacji profilu użytkownika.
        GET /api/accounts/profile/ - pobierz profil
        PUT /api/accounts/profile/ - zaktualizuj profil
        PATCH /api/accounts/profile/ - częściowa aktualizacja profilu
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
  /api/accounts/register:
    post:
      operationId: accounts_register_create
      description: |-
        Endpoint do rejestracji nowych użytkowników.
        POST /api/accounts/register/
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/accounts/token/refresh:
    post:
      operationId: accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/token/verify:
    post:
      operationId: accounts_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/albums:
    get:
      operationId: albums_retrieve
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: albums_create
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/albums/{album_id}:
    get:
      operationId: albums_retrieve_2
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: albums_destroy
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/albums/{album_id}/media:
    post:
      operationId: albums_media_create
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/albums/{album_id}/media/{media_id}:
    post:
      operationId: albums_media_create_2
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: media_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: albums_media_destroy
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: media_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/groups:
    get:
      operationId: groups_retrieve
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: groups_create
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/groups/{group_id}:
    get:
