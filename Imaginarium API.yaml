  /api/shares/for-me:
    get:
      operationId: shares_for_me_retrieve
      tags:
      - shares
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/shares/group:
    post:
      operationId: shares_group_create
      tags:
      - shares
      security:
      - jwtAuth: []
      responses:
