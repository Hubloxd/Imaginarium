name: imaginarium-dotnet
services:
  imaginarium-backend:
    container_name: imaginarium-backend
    build:
      context: ../src/dotnet/imaginarium-backend/
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - env/imaginarium.env

  imaginarium-front:
    container_name: imaginarium-front
    build:
      context: ../src/angular/imaginarium-front/
    restart: unless-stopped
    ports:
      - "8080:80"
    # env_file:
    #   - env/imaginarium-front.env

  postgres:
    container_name: imaginarium-dotnet-postgres
    image: postgres:14.2
    restart: unless-stopped
    env_file:
      - env/postgres.env

  redis:
    container_name: imaginarium-redis
    image: redis
    restart: unless-stopped

  nginx:
    container_name: imaginarium-nginx
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - imaginarium-backend
      - imaginarium-front
      - postgres
      - redis

