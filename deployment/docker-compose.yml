name: imaginarium-dotnet
services:
  imaginarium-backend:
    container_name: imaginarium-backend
    build:
      context: ../src/dotnet/imaginarium-backend/
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - env/imaginarium.env
    volumes:
      - media-storage:/app/Storage
      - thumbnail-storage:/app/Storage/Thumbnails

  imaginarium-front:
    container_name: imaginarium-front
    build:
      context: ../src/angular/imaginarium-front/
    restart: unless-stopped
    ports:
      - "8080:80"
    # env_file:
    #   - env/imaginarium-front.env

  postgres:
    container_name: imaginarium-dotnet-postgres
    image: postgres:14.2
    restart: unless-stopped
    env_file:
      - env/postgres.env

  pgadmin:
    container_name: imaginarium-dotnet-pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin

  redis:
    container_name: imaginarium-redis
    image: redis
    restart: unless-stopped

  ai-classification:
    container_name: imaginarium-ai-classification
    build:
      context: ../src/fastapi/ai-classification/
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/app/.cache/torch
    volumes:
      - torch-cache:/app/.cache/torch
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    container_name: imaginarium-nginx
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - "4444:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media-storage:/usr/share/nginx/html/media:ro
      - thumbnail-storage:/usr/share/nginx/html/thumbnails:ro
    depends_on:
      - imaginarium-backend
      - imaginarium-front
      - postgres
      - redis
      - ai-classification

volumes:
  media-storage:
  thumbnail-storage:
  torch-cache:

