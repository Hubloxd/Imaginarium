server {
    listen 80;
    server_name _;

    client_max_body_size 4G;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    add_header Cache-Control no-cache;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://imaginarium-front:80;
    }

    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://imaginarium:8000;
    }

    location /admin {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://imaginarium:8000;
    }

    location /static {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://imaginarium:8000;
    }

    # Uplodowane pliki (MEDIA_URL) - serwowane bezpośrednio przez nginx
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Miniaturki (THUMBNAILS_URL) - serwowane bezpośrednio przez nginx
    location /thumbnails/ {
        alias /var/www/thumbnails/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
