@if (visible()) {
  <div class="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4" (click)="closeModal()">
    <div class="bg-gray-900 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b border-gray-800">
        <h2 class="text-xl font-semibold text-white">Edytuj zdjęcie</h2>
        <button
          (click)="closeModal()"
          class="text-gray-400 hover:text-white transition-colors p-1"
          aria-label="Zamknij"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Content -->
      <div class="p-6 space-y-6">
        <!-- Current file info -->
        <div>
          <p class="text-sm text-gray-400 mb-2">Aktualny plik:</p>
          <p class="text-white font-medium">{{ mediaFileName }}</p>
        </div>

        <!-- Drag and drop area -->
        <div
          [class.border-blue-500]="isDragging()"
          [class.bg-blue-500/10]="isDragging()"
          class="border-2 border-dashed border-gray-700 rounded-lg p-8 text-center transition-colors"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        >
          @if (!selectedFile) {
            <div class="space-y-4">
              <svg class="w-16 h-16 mx-auto text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <div>
                <p class="text-white text-lg font-medium mb-2">Przeciągnij i upuść nowy plik</p>
                <p class="text-gray-400 text-sm mb-4">lub</p>
                <label class="inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg cursor-pointer transition-colors">
                  Wybierz plik
                  <input
                    type="file"
                    class="hidden"
                    accept="image/*,video/*"
                    (change)="onFileSelected($event)"
                  />
                </label>
              </div>
            </div>
          } @else {
            <div class="space-y-4">
              <svg class="w-12 h-12 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <div>
                <p class="text-white font-medium">{{ selectedFile.name }}</p>
                <p class="text-gray-400 text-sm mt-1">{{ formatFileSize(selectedFile.size) }}</p>
              </div>
              <button
                (click)="selectedFile = null"
                class="text-gray-400 hover:text-white text-sm transition-colors"
              >
                Wybierz inny plik
              </button>
            </div>
          }
        </div>

        <!-- Error message -->
        @if (error()) {
          <div class="bg-red-500/20 border border-red-500/50 rounded-lg p-4">
            <p class="text-red-400 text-sm">{{ error() }}</p>
          </div>
        }

        <!-- Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-gray-800">
          <button
            (click)="deleteMedia()"
            [disabled]="isDeleting() || isUploading()"
            class="px-4 py-2 bg-red-600 hover:bg-red-700 disabled:bg-red-800 disabled:cursor-not-allowed text-white rounded-lg transition-colors flex items-center gap-2"
          >
            @if (isDeleting()) {
              <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            }
            <span>Usuń zdjęcie</span>
          </button>

          <div class="flex items-center gap-3">
            <button
              (click)="closeModal()"
              class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
            >
              Anuluj
            </button>
            <button
              (click)="uploadFile()"
              [disabled]="!selectedFile || isUploading() || isDeleting()"
              class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white rounded-lg transition-colors flex items-center gap-2"
            >
              @if (isUploading()) {
                <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                <span>Zapisywanie...</span>
              } @else {
                <span>Zastąp plik</span>
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
