<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Witaj w Imaginarium!</h1>
        <button
          (click)="logout()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
        >
          Wyloguj się
        </button>
      </div>

      <div class="space-y-4">
        <div class="bg-gray-50 rounded-lg p-6">
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Twój profil</h2>
          @if (authService.currentUser(); as user) {
            <div class="space-y-2">
              <p class="text-gray-700"><span class="font-medium">Email:</span> {{ user.email }}</p>
              <p class="text-gray-700"><span class="font-medium">Nazwa użytkownika:</span> {{ user.username }}</p>
              @if (user.first_name || user.last_name) {
                <p class="text-gray-700">
                  <span class="font-medium">Imię i nazwisko:</span> 
                  {{ user.first_name }} {{ user.last_name }}
                </p>
              }
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
